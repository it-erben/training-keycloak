# Die Keycloak-CR: der Operator erzeugt daraus StatefulSet, Services und das
# Secret "keycloak-initial-admin". TLS terminiert der Ingress, daher HTTP im
# Cluster und X-Forwarded-Header vom Ingress-Controller.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1
  db:
    vendor: postgres
    host: postgres
    port: 5432
    database: keycloak
    usernameSecret:
      name: postgres-credentials
      key: username
    passwordSecret:
      name: postgres-credentials
      key: password
  hostname:
    hostname: https://keycloak.mustertech.test
  http:
    httpEnabled: true
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  additionalOptions:
    - name: metrics-enabled
      value: "true"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1500Mi
