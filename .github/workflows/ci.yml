name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    uses: it-erben/ci/.github/workflows/lint.yml@1.0.1
  slides:
    uses: it-erben/ci/.github/workflows/slides.yml@1.0.1
  workshop-slides:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - name: Render workshop slides
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p workshop-pdfs
          for deck in workshops/*/slides.md; do
            workshop=$(basename "$(dirname "$deck")")
            npx --yes @marp-team/marp-cli@4.2.3 "$deck" \
              --pdf --allow-local-files -o "workshop-pdfs/$workshop.pdf"
          done
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: workshop-folien
          path: workshop-pdfs/*.pdf
          if-no-files-found: error
  rotation-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - name: Test rotation lab tools
        run: python -m unittest discover -s labs/assignments/modul-10c-rotation/tools
  release:
    needs: [lint, slides, workshop-slides, rotation-tools]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: it-erben/ci/.github/workflows/release.yml@1.0.1
  pages:
    needs: [slides, release]
    if: needs.release.outputs.published == 'true'
    permissions:
      pages: write
      id-token: write
    uses: it-erben/ci/.github/workflows/pages.yml@1.0.1
