# ============================================
# Keycloak Demo - Modul 03: Installation &
#   Grundkonfiguration
# ============================================
# Separate Instanz auf Port 9090, damit kein
# Konflikt mit den Übungen (Port 8080) entsteht.
#
# Starten:   docker compose up -d
# Stoppen:   docker compose down
# Logs:      docker compose logs -f demo-keycloak
# Reset:     docker compose down -v && docker compose up -d

services:
  # ------------------------------------------
  # PostgreSQL Datenbank
  # ------------------------------------------
  demo-postgres:
    image: postgres:18-alpine
    container_name: demo-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_db_password
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - demo-network

  # ------------------------------------------
  # Keycloak Identity Provider
  # ------------------------------------------
  demo-keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: demo-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://demo-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_db_password
      KC_HOSTNAME: http://localhost:9090
    ports:
      - "9090:8080"
    depends_on:
      demo-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - demo-network

  # ------------------------------------------
  # Einmalig: SSL-Pflicht im master-Realm
  # deaktivieren (nötig wenn Docker die
  # Host-IP nicht als localhost durchreicht)
  # ------------------------------------------
  demo-setup:
    image: quay.io/keycloak/keycloak:26.5
    container_name: demo-setup
    depends_on:
      demo-keycloak:
        condition: service_healthy
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        /opt/keycloak/bin/kcadm.sh config credentials \
          --server http://demo-keycloak:8080 --realm master \
          --user admin --password admin
        /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=NONE
    networks:
      - demo-network

volumes:
  demo_postgres_data:
    name: demo-postgres-data

networks:
  demo-network:
    name: demo-network
